<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #ffc0cb;
    font-family: Arial;
}

.calculator {
    padding: 20px;
    border-radius: 20px;
    background: #ffc0cb;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

#display {
    width: 100%;
    height: 50px;
    font-size: 22px;
    text-align: right;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
    padding: 8px;
    background: white;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 60px);
    gap: 8px;
}

button {
    height: 50px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    background: #ffb6c1;
}

.operator { background: #ff69b4; color: white; }
.equal { background: green; color: white; }
.clear { background: red; color: white; }
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" placeholder="0">

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="append('(')">(</button>
        <button onclick="append(')')">)</button>
        <button onclick="append('/')">/</button>
        <button onclick="append('*')">*</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('-')">-</button>
        <button onclick="append('+')">+</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('.')">.</button>
        <button onclick="append('%')">%</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>

        <!-- Scientific -->
        <button class="operator" onclick="append('sin(')">sin</button>
        <button class="operator" onclick="append('cos(')">cos</button>
        <button class="operator" onclick="append('tan(')">tan</button>
        <button class="operator" onclick="append('sqrt(')">√</button>
        <button class="operator" onclick="append('log(')">log</button>
    </div>
</div>

<script>
let display = document.getElementById("display");

function append(val) {
    display.value += val;
}

function clearDisplay() {
    display.value = "";
}

// 🔥 FINAL CALCULATE FUNCTION
function calculate() {
    try {
        let expression = display.value;

        expression = expression.replace(/sin\(([^)]+)\)/g, function(_, val) {
            return Math.sin(eval(val) * Math.PI / 180);
        });

        expression = expression.replace(/cos\(([^)]+)\)/g, function(_, val) {
            return Math.cos(eval(val) * Math.PI / 180);
        });

        expression = expression.replace(/tan\(([^)]+)\)/g, function(_, val) {
            return Math.tan(eval(val) * Math.PI / 180);
        });

        expression = expression.replace(/sqrt\(([^)]+)\)/g, function(_, val) {
            return Math.sqrt(eval(val));
        });

        expression = expression.replace(/log\(([^)]+)\)/g, function(_, val) {
            return Math.log10(eval(val));
        });

        display.value = eval(expression);

    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
